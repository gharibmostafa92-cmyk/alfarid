name: Frontend checks

on:
  pull_request:
    paths:
      - 'bags-platform/frontend/**'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches: [main]
    paths:
      - 'bags-platform/frontend/**'
      - '.github/workflows/frontend-checks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bags-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: bags-platform/frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: bags-platform/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run test
