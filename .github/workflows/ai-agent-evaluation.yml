name: AI agent evaluation
on:
  pull_request:
    paths:
      - 'bags-platform/backend/app/Services/Ai/**'
      - 'bags-platform/backend/app/Console/Commands/EvaluateAiAgent.php'
      - 'bags-platform/backend/tests/Fixtures/ai-agent-egyptian.json'
      - '.github/workflows/ai-agent-evaluation.yml'
  push:
    branches: [main]
    paths:
      - 'bags-platform/backend/app/Services/Ai/**'
      - 'bags-platform/backend/app/Console/Commands/EvaluateAiAgent.php'
      - 'bags-platform/backend/tests/Fixtures/ai-agent-egyptian.json'
      - 'bags-platform/backend/config/services.php'
  workflow_dispatch:
    inputs:
      model:
        description: Gemini model identifier to evaluate
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bags-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, zip, pgsql, pdo_pgsql
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan ai:evaluate --check
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alfarid_ai_eval
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: bags-platform/backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: alfarid_ai_eval
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
      LOCAL_ADMIN_PASSWORD: OnlyForIsolatedEvaluation12345
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, gd, intl, zip, pgsql, pdo_pgsql
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan migrate --force
      - run: php artisan db:seed --class=LocalAdminSeeder --force
      - run: php artisan ai:evaluate --min-accuracy=0.85
