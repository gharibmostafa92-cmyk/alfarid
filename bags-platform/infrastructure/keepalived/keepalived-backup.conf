global_defs {
    enable_script_security
    script_user root
}
vrrp_script chk_haproxy {
    script "/usr/bin/curl -fsS --max-time 1 http://127.0.0.1:8404/metrics"
    interval 1
    weight -20
}

# BACKUP on haproxy2 host (same virtual_router_id as master).
vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 0.5
    unicast_src_ip 172.31.0.11
    unicast_peer {
        172.31.0.10
    }
    authentication {
        auth_type PASS
        auth_pass ALFdemo1
    }
    virtual_ipaddress {
        172.31.0.100/24
    }
    track_script {
        chk_haproxy
    }
}
