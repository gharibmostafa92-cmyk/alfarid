services:
  tests:
    extends: {file: docker-compose.yml, service: app1}
    image: alfarid-tests:local
    build: {context: .., dockerfile: infrastructure/docker/tests.Dockerfile}
    entrypoint: [sh, -c, 'php artisan config:clear && php artisan test "$@"', '--']
    environment:
      APP_ENV: testing
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: alfarid_testing
      CACHE_STORE: array
      CACHE_LIMITER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      APP_MAINTENANCE_DRIVER: file
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_BUCKET: ''
      AWS_ENDPOINT: ''
      R2_ACCESS_KEY_ID: ''
      R2_SECRET_ACCESS_KEY: ''
      R2_BUCKET: ''
      R2_ENDPOINT: ''
      WHATSAPP_TOKEN: ''
      WA_GATEWAY_SECRET: ''
      WA_SESSION_KEY: ''
      TURNSTILE_SECRET_KEY: ''
    healthcheck: {disable: true}
    restart: 'no'
    profiles: [test]
