services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_DB: alfarid_testing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: alfarid_testing
    networks: [appnet]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, alfarid_testing]
      interval: 2s
      timeout: 3s
      retries: 15
    profiles: [test]
  tests:
    extends: {file: docker-compose.yml, service: app1}
    image: alfarid-tests:local
    build: {context: .., dockerfile: infrastructure/docker/tests.Dockerfile}
    entrypoint: [sh, -c, 'php artisan config:clear && php artisan test "$@"', '--']
    environment:
      APP_ENV: testing
      DB_HOST: postgres-test
      DB_PORT: '5432'
      DB_DATABASE: alfarid_testing
      DB_USERNAME: postgres
      DB_PASSWORD: alfarid_testing
      DB_SSLMODE: disable
      DB_URL: ''
      DB_RUNTIME_ROLE: ''
      CACHE_STORE: array
      CACHE_LIMITER: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      APP_MAINTENANCE_DRIVER: file
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      AWS_ACCESS_KEY_ID: ''
      AWS_SECRET_ACCESS_KEY: ''
      AWS_BUCKET: ''
      AWS_ENDPOINT: ''
      R2_ACCESS_KEY_ID: ''
      R2_SECRET_ACCESS_KEY: ''
      R2_BUCKET: ''
      R2_ENDPOINT: ''
      WHATSAPP_TOKEN: ''
      WA_GATEWAY_SECRET: ''
      WA_SESSION_KEY: ''
      TURNSTILE_SECRET_KEY: ''
    healthcheck: {disable: true}
    restart: 'no'
    profiles: [test]
