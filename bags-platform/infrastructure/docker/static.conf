# conf.d is loaded from nginx's http context, so map belongs here.
include /usr/share/nginx/html/security-headers.nginx-map.conf;
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /usr/share/nginx/html/security-headers.nginx-server.conf;
    location / { try_files $uri $uri/ /index.html; }
    location = /healthz { access_log off; return 200 'ok'; }
    location ~ \.conf$ { deny all; }
}
