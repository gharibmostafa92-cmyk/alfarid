global
    log stdout format raw local0
    maxconn 50000
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    ssl-default-bind-options ssl-min-ver TLSv1.2
    master-worker

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-keep-alive
    option redispatch 1
    retries 2
    retry-on conn-failure empty-response
    timeout connect 1s
    timeout client 30s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 20s
    default-server resolvers docker init-addr last,libc,none

frontend fe_public
    bind :80
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-request redirect scheme https code 301 unless { ssl_fc }

    # Request ID
    unique-id-format %[uuid()]
    unique-id-header X-Request-ID

    # Strip any client-supplied X-Forwarded-For (spoof protection), then set the real one.
    http-request del-header Forwarded
    http-request del-header X-Forwarded-Host
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Port %[dst_port]

    # Never retry requests that change data.
    http-request disable-l7-retry unless METH_GET || METH_HEAD

    # Health endpoints are internal only.
    http-request deny deny_status 404 if { path_beg /health } || { path /up }

    # 25 MB request cap.
    http-request deny deny_status 413 if { req.hdr_val(content-length) gt 26214400 }

    # Edge rate limit (first layer before Laravel).
    stick-table type ipv6 size 1m expire 60s store http_req_rate(10s),conn_cur
    acl whitelisted src -f /etc/haproxy/whitelist.lst
    http-request track-sc0 src unless whitelisted
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 300 }
    http-request deny deny_status 429 if { sc_conn_cur(0) gt 100 }

    # Routing by domain.
    acl host_api   hdr(host),field(1,:) -i api.alfarid.example
    acl host_admin hdr(host),field(1,:) -i admin.alfarid.example
    acl host_pos   hdr(host),field(1,:) -i pos.alfarid.example
    acl slow_path  path_beg /api/v1/admin/reports /api/v1/wholesale/price-list/export /api/v1/admin/price-lists

    use_backend be_api_slow   if host_api slow_path
    use_backend be_api        if host_api
    use_backend be_backoffice if host_admin
    use_backend be_pos        if host_pos
    default_backend be_storefront

backend be_api
    balance leastconn
    option httpchk
    http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host api.internal
    http-check expect status 200
    default-server check inter 1s fall 3 rise 2 slowstart 20s maxconn "${APP_MAXCONN}"
    server app1 app1:8080
    server app2 app2:8080
    server app3 app3:8080

backend be_api_slow
    balance leastconn
    timeout server 180s
    server app1 app1:8080 track be_api/app1 maxconn "${APP_SLOW_MAXCONN}"
    server app2 app2:8080 track be_api/app2 maxconn "${APP_SLOW_MAXCONN}"
    server app3 app3:8080 track be_api/app3 maxconn "${APP_SLOW_MAXCONN}"

backend be_storefront
    balance roundrobin
    option httpchk GET /healthz
    default-server check inter 3s fall 3 rise 2
    server sf1 storefront1:3000
    server sf2 storefront2:3000

backend be_backoffice
    server bo1 backoffice:80 check

backend be_pos
    server pos1 pos:80 check

# Internal frontend for Next.js SSR: does NOT strip X-Forwarded-For, so the
# storefront can forward the real client IP it received from fe_public.
frontend fe_internal
    bind :8081
    unique-id-format %[uuid()]
    unique-id-header X-Request-ID
    option forwardfor
    acl trusted_internal src -f /etc/haproxy/internal-clients.lst
    http-request deny unless trusted_internal
    http-request disable-l7-retry unless METH_GET || METH_HEAD
    acl host_api_slow path_beg /api/v1/admin/reports /api/v1/wholesale/price-list/export
    use_backend be_api_slow if host_api_slow
    default_backend be_api

frontend fe_stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats auth admin:${HAPROXY_STATS_PASSWORD}
    http-request use-service prometheus-exporter if { path /metrics }
