server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Build-generated headers (vite plugin emits these into dist/).
    include /usr/share/nginx/html/security-headers.nginx-server.conf;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
