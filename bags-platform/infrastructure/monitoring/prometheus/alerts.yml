groups:
  - name: alfarid-lb
    rules:
      - alert: ServerDown
        expr: haproxy_server_status{state="DOWN",proxy="be_api"} == 1 or up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Backend server DOWN for more than 1 minute'

      - alert: High5xxRate
        expr: sum by (instance, proxy) (rate(haproxy_backend_http_responses_total{code="5xx"}[5m])) / clamp_min(sum by (instance, proxy) (rate(haproxy_backend_http_responses_total[5m])), 0.001) > 0.01
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '5xx rate above 1%'

      - alert: HighP95Latency
        expr: k6_http_req_duration_p95 > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'p95 latency above 1s'

      - alert: HAProxyQueueBacklog
        expr: haproxy_backend_current_queue > 50
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'HAProxy queue above 50 — app nodes saturated'
      - alert: ApplicationQueueBacklog
        expr: alfarid_queue_pending > 1000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: 'Database queue has more than 1000 pending jobs'
      # Shared cache/security state uses noeviction; alert before writes fail.
      - alert: RedisMemoryHigh
        expr: (redis_memory_used_bytes / redis_memory_max_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Redis memory above 80% of maxmemory'

      - alert: RedisSecurityStateEvicted
        expr: increase(redis_evicted_keys_total[5m]) > 0
        labels:
          severity: critical
        annotations:
          summary: 'Redis evicted security counters or locks; check the runtime memory policy'
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'PostgreSQL is down'}
      - alert: PgBouncerDown
        expr: pgbouncer_up == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'PgBouncer is down'}
      - alert: PgBouncerClientsWaiting
        expr: max by (database) (pgbouncer_pools_client_waiting_connections) > 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'PgBouncer pool saturated (clients waiting)'}
      - alert: RedisReplicaMissing
        expr: max(redis_connected_slaves) < 1
        for: 2m
        labels: {severity: warning}
        annotations: {summary: 'Redis master has no connected replica'}
      - alert: DiskAlmostFull
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 10m
        labels: {severity: critical}
        annotations: {summary: 'Less than 15% disk free'}
      - alert: ApiLatencyHigh
        expr: haproxy_backend_response_time_average_seconds{proxy="be_api"} > 1
        for: 5m
        labels: {severity: warning}
        annotations: {summary: 'Production API average response time above 1s'}
      - alert: BackupFailed
        expr: alfarid_backup_last_run_success == 0
        labels: {severity: critical}
        annotations: {summary: 'Last PostgreSQL backup run failed'}
      - alert: BackupTooOld
        expr: time() - alfarid_backup_last_success_timestamp_seconds > 26 * 3600 or absent(alfarid_backup_last_success_timestamp_seconds)
        for: 30m
        labels: {severity: critical}
        annotations: {summary: 'No successful backup in the last 26 hours'}
