server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        regex: alfarid-lb
        action: keep
    pipeline_stages:
      # Docker service discovery already unwraps Docker's log envelope.
      - static_labels:
          job: alfarid
      - json:
          expressions:
            request_id: context.request_id
            node: context.node
      - labels:
          node:
