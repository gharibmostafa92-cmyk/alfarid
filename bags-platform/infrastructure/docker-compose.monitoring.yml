# Merge with docker-compose.yml to share appnet.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9098}:9090']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--web.enable-remote-write-receiver']
    networks: [appnet]
  grafana:
    image: grafana/grafana:11.1.0
    ports: ['127.0.0.1:${GRAFANA_PORT:-3008}:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [appnet]
  loki:
    image: grafana/loki:3.0.0
    user: '0:0'
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    networks: [appnet]
  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [appnet]
  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ['--path.rootfs=/host']
    volumes: ['/:/host:ro']
    networks: [appnet]
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes: ['/:/rootfs:ro', '/var/run:/var/run:ro', '/sys:/sys:ro', '/var/lib/docker:/var/lib/docker:ro']
    networks: [appnet]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_USERNAME:?}:${DB_PASSWORD:?}@postgres:5432/alfarid?sslmode=require
    command: ['--extend.query-path=/etc/exporter/queries.yml']
    volumes: [./monitoring/postgres-queries.yml:/etc/exporter/queries.yml:ro]
    networks: [appnet]
  redis-exporter:
    image: oliver006/redis_exporter:v1.61.0
    environment:
      REDIS_ADDR: redis://haproxy-data:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    networks: [appnet]
  pgbouncer-exporter:
    image: prometheuscommunity/pgbouncer-exporter:v0.8.0
    restart: unless-stopped
    depends_on: [pgbouncer]
    command: ['--pgBouncer.connectionString=postgres://${DB_USERNAME:?}:${DB_PASSWORD:?}@pgbouncer:6432/pgbouncer?sslmode=require']
    networks: [appnet]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: [./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro]
    networks: [appnet]
volumes:
  grafana-data:
  prometheus-data:
  loki-data:
