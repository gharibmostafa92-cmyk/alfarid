[databases]
alfarid = host=postgres port=5432 dbname=alfarid max_db_connections=50
; Dedicated test database, never the live catalog. Created by test-backend.sh.
; M-3: small, hard-capped pool so tests on a shared cluster cannot exhaust connections.
alfarid_testing = host=postgres port=5432 dbname=alfarid_testing pool_size=5 max_db_connections=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
pool_mode = transaction
# F27 pool budget: default_pool_size ~= (projected app processes x avg conns/process x 1.5 peak) / sharing, capped at 80% of max_connections minus reserve for migrator/monitor. Recompute when FPM children or HAProxy maxconn change.
max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 10
; M-3: fail queued clients before HAProxy's 60s server timeout (08P01 -> 503 + Retry-After).
query_wait_timeout = 15
max_db_connections = 50
; Needed so prepared statements work through transaction pooling (PgBouncer >= 1.21).
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
client_tls_sslmode = require
client_tls_key_file = /tmp/pgbouncer/tls/server.key
client_tls_cert_file = /tmp/pgbouncer/tls/server.crt
server_tls_sslmode = require
