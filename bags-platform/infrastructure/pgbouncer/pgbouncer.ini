[databases]
alfarid = host=postgres port=5432 dbname=alfarid
; Dedicated test database, never the live catalog. Created by test-backend.sh.
alfarid_testing = host=postgres port=5432 dbname=alfarid_testing

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 40
reserve_pool_size = 10
; Needed so prepared statements work through transaction pooling (PgBouncer >= 1.21).
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
client_tls_sslmode = require
client_tls_key_file = /tmp/pgbouncer/tls/server.key
client_tls_cert_file = /tmp/pgbouncer/tls/server.crt
server_tls_sslmode = require
